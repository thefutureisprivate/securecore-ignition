---
name: 'YAML'

'on':
  - 'pull_request'
  - 'push'
  - 'workflow_dispatch'

permissions:
  contents: 'read'

jobs:
  yamllint:
    name: 'yamllint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          token: '${{ github.token }}'

      - name: 'Set up Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v6
        with:
          python-version: '3.x'

      - name: 'Install yamllint'
        run: 'python -m pip install yamllint'

      - name: 'Run yamllint'
        run: 'python -m yamllint .'
