---
name: 'YAML'

'on':
  - 'pull_request'
  - 'push'
  - 'workflow_dispatch'

permissions:
  contents: 'read'

jobs:
  yamllint:
    name: 'yamllint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0' # v7.0.0
        with:
          token: '${{ github.token }}'

      - name: 'Set up Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v6
        with:
          python-version: '3.x'

      - name: 'Install yamllint'
        run: 'python -m pip install yamllint'

      - name: 'Run yamllint'
        run: 'python -m yamllint .'
